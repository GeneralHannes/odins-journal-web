<script>/* the app's language: the one chosen on this device, else the device's own (Khmer, Chinese), else English; set on <html lang> first so the right fonts load from the first paint */
(function(){var l="en";try{var s=localStorage.getItem("yai_lang");if(s==="en"||s==="zh"||s==="km")l=s;else{var n=navigator.languages||[navigator.language||"en"];for(var i=0;i<n.length;i++){var c=String(n[i]).toLowerCase();if(c.indexOf("km")===0){l="km";break}if(c.indexOf("zh")===0){l="zh";break}if(c.indexOf("en")===0)break}}}catch(e){}document.documentElement.lang=l})();</script>
<script>if(navigator.standalone)document.documentElement.classList.add("ios-app");
/* iPhone only (not iPad or Android): its own safe-area layout, see "iPhone" in the styles */
if(/iPhone|iPod/.test(navigator.userAgent))document.documentElement.classList.add("ios-phone");
/* Android: its Chrome misdraws live background blur (stale strips over the month header), so the glass there
   is drawn without it — see "Android" in the styles */
if(/Android/.test(navigator.userAgent)){document.documentElement.classList.add("android");if(+((navigator.userAgent.match(/Chrome\/(\d+)/)||[])[1]||0)>=115)document.documentElement.classList.add("android-blur")}</script>
<script>/* light (Catppuccin Latte) unless this device chose another theme (Daylight is also defined: data-theme="daylight") */
try{var t=localStorage.getItem("sk_theme");document.documentElement.setAttribute("data-theme",t||"latte");var g=localStorage.getItem("yai_glass");if(g==="soft"||g==="solid")document.documentElement.classList.add("gl-"+g)}catch(e){document.documentElement.setAttribute("data-theme","latte")}</script>

<title>Odin’s Journal</title>
<!--
  Odin’s Journal (was Odin's Journal) — future planned events (deliveries, bills, staff schedule,
  promotions). Its own app in its own space on purpose: separate from Odin's
  Vault's admin/inventory workflow, so it can be opened, bookmarked and used
  on its own without any of Vault's tab-switching machinery. Reads/writes
  only /api/journal/*, and shares nothing with Vault except the PIN
  (localStorage `sk_token`; the journal keeps its own session in `jr_token`) and the same visual language.
-->
<link rel="preload" href="static/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/app.50aa8170ac.css">
<script>
/* Embed mode (src/modules/apps): opened as ?embed=1 inside another app's frame
   (Odin's Vault's tab, or any future host), this page drops its own app
   switcher. Runs in <head> so the chrome never flashes in. */
if(/[?&]embed=1\b/.test(location.search) && window.top!==window) document.documentElement.classList.add('embedded');
</script>
</head>
<body>
<!-- no title: the bar is just the gold line along the top (and the space under the phone's status bar) -->
<header class="keep-bar jr-bar-bare" aria-hidden="true"></header>
<div class="jr-shell">
  <!-- the small side section: only the two views and Add event -->
  <nav class="jr-rail" aria-label="Journal" data-i18n-aria="journalAria">
    <div class="jr-viewtoggle k-shine" id="jr-viewtoggle">
      <button class="jr-vt-btn" id="jr-view-calendar-btn" onclick="setJournalView('calendar')" title="Calendar" data-i18n-title="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><span data-i18n="calendar">Calendar</span></button>
      <button class="jr-vt-btn" id="jr-view-agenda-btn" onclick="setJournalView('agenda')" title="Agenda" data-i18n-title="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".9" fill="currentColor"/><circle cx="4" cy="12" r=".9" fill="currentColor"/><circle cx="4" cy="18" r=".9" fill="currentColor"/></svg><span data-i18n="agenda">Agenda</span></button>
      <button class="jr-vt-btn" id="jr-view-people-btn" onclick="setJournalView('people')" title="People" data-i18n-title="peopleTab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.8.8 3 2.6 3 5.6"/></svg><span data-i18n="peopleTab">People</span></button>
    </div>
    <!-- desktop: what's coming up, in date order (hidden on phones) -->
    <section class="jr-upnext" id="jr-upnext" aria-label="Upcoming events" data-i18n-aria="upcomingAria"></section>
    <div data-lang-slot="rail"></div>
    <button type="button" class="jr-scan k-shine" onclick="jrScan()" title="Add from a photo" data-i18n-title="scanBtn" aria-label="Add from a photo" data-i18n-aria="scanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/><path d="m19.2 3.2.45 1.35L21 5l-1.35.45L19.2 6.8l-.45-1.35L17.4 5l1.35-.45z"/></svg><span data-i18n="scanBtn">Add from a photo</span></button>
    <button class="act jr-add k-shine" onclick="openAddEvent(JR_VIEW==='calendar'?JR_SEL:undefined)" title="Add event" data-i18n-title="addEvent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addEvent">Add event</span></button>
  </nav>

  <main>
    <div id="jr-agenda" style="display:none">
      <div class="row jr-agenda-head"><h2 class="view-title" data-i18n="agenda">Agenda</h2><span data-lang-slot="agenda"></span><div class="jr-me" id="jr-me"></div>
        <label class="muted jr-showpast"><input type="checkbox" id="jr-show-past" onchange="renderAgenda()"> <span data-i18n="showPast">show past</span></label></div>
      <div id="jr-agenda-list"><span class="empty" data-i18n="loading">Loading&hellip;</span></div>
    </div>

    <div id="jr-people" style="display:none">
      <div class="row jr-agenda-head"><h2 class="view-title" data-i18n="peopleTab">People</h2><button type="button" class="act jr-pp-add" id="jr-pp-add" onclick="jrPersonForm()" hidden>＋ <span data-i18n="addPerson">Add person</span></button><button type="button" class="jr-gear" onclick="jrSettings()" title="Settings" aria-label="Settings" data-i18n-title="settings" data-i18n-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
      <p class="jr-ae-hint" data-i18n="peopleHint"></p>
      <input id="jr-people-q" type="search" autocomplete="off" data-i18n-ph="findPeople" oninput="jrRenderPeople()">
      <div id="jr-people-list"></div>
    </div>

    <div id="jr-calendar">
      <div class="jr-split">
      <!-- top: the month, sized to whatever space there is -->
      <section class="jr-top" aria-label="Month" data-i18n-aria="monthAria">
        <div class="jr-cal-head">
          <h2 class="jr-month"><span id="jr-cal-month"></span> <span class="jr-year" id="jr-cal-year"></span></h2>
          <button type="button" class="jr-money-btn jr-money-month" id="jr-money-mbtn" onclick="jrMoney()" hidden></button>
          <button type="button" class="jr-gear" onclick="jrSettings()" title="Settings" aria-label="Settings" data-i18n-title="settings" data-i18n-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </div>
        <div class="jr-cal-dow" id="jr-cal-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
        <div class="jr-cal-grid" id="jr-cal-grid"></div>
      </section>
      <!-- bottom: everything on the selected day, and only that day -->
      <section class="jr-bottom k-shine" id="jr-day" aria-live="polite"></section>
      </div>
      <!-- month arrows and Today, down where the thumb is -->
      <div class="jr-monthnav k-shine" id="jr-monthnav" role="group" aria-label="Change month" data-i18n-aria="changeMonth">
        <button class="jr-mn-btn" onclick="calShiftMonth(-1)" aria-label="Previous month" data-i18n-aria="prevMonth"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="jr-mn-today" onclick="calGoToday()" data-i18n="today">Today</button>
        <button class="jr-mn-btn" onclick="calShiftMonth(1)" aria-label="Next month" data-i18n-aria="nextMonth"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </main>
</div>

<script src="static/app.5dabe71911.js"></script>
<script>/* offline app shell (static/sw.js) and staying current. The installed app (home screen, Android wrapper) is often brought back to the
   front rather than opened anew, so: look for a new version on every open and every return to the front; and when one is ready,
   apply it WITHOUT being asked at a moment where nothing can be lost — just opened or returned and not touched yet, or while the app
   is in the background — otherwise show a tap-to-reload pill (and still apply it when the app next goes to the background). */
if("serviceWorker" in navigator&&window.isSecureContext&&!/[?&]nosw\b/.test(location.search)){
  var kHadSW=!!navigator.serviceWorker.controller,   /* false on the very first visit: that first "controllerchange" is the install, not an update */
      kFront=0, kInput=-1, kPending=false, kReloading=false;
  ["pointerdown","keydown","touchstart","wheel"].forEach(function(t){addEventListener(t,function(){kInput=performance.now();},{capture:true,passive:true});});
  function kCheck(){ navigator.serviceWorker.getRegistration().then(function(r){r&&r.update().catch(function(){});}); }
  addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){r.update().catch(function(){});}).catch(function(){});});
  /* nothing the person could lose by the page reloading right now */
  function kSafe(){
    if(document.querySelector(".modal-ov:not([data-k-leaving]),#pin-ov,#pw-ov,.jr-pop")) return false;          /* a form, sheet or pop-up is open */
    if(typeof JR_EVDRAG!=="undefined"&&JR_EVDRAG) return false;                                              /* an event is being dragged */
    if(performance.now()-kInput<1500) return false;                                                          /* a tap or key a moment ago */
    var f=document.querySelectorAll("input:not([type=checkbox]):not([type=radio]):not([type=search]):not([type=hidden]),textarea");
    for(var i=0;i<f.length;i++) if(f[i].value&&f[i].offsetParent) return false;                              /* typed and not sent (sign-in...) */
    return true;
  }
  /* at most one automatic reload per 30 s, so a problem can never become a reload loop */
  function kReload(){
    if(kReloading) return true;
    try{ var t=+sessionStorage.getItem("yai_autoreload")||0; if(Date.now()-t<30000) return false; sessionStorage.setItem("yai_autoreload",String(Date.now())); }catch(e){}
    kReloading=true; location.reload(); return true;
  }
  function kPill(){
    if(document.getElementById("k-upd")) return;
    var b=document.createElement("button");b.id="k-upd";b.type="button";b.textContent=typeof tx==="function"?tx("newVersion"):"New version — tap to reload";
    b.style.cssText="position:fixed;left:50%;top:calc(.7rem + env(safe-area-inset-top));transform:translateX(-50%);z-index:99;border:0;border-radius:999px;padding:.55rem 1rem;font:600 .85rem system-ui,sans-serif;background:#82aaff;color:#16182a;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer";
    b.onclick=function(){location.reload();};document.body.appendChild(b);
  }
  function kUpdated(){
    kPending=true;
    var calm=performance.now()-kFront<6000&&kInput<kFront;      /* just opened or brought back, and not touched since */
    if((document.hidden||calm)&&kSafe()&&kReload()) return;
    if(!document.hidden) kPill();
  }
  /* two signals: the page itself changed under the same worker (message), or a new worker took over (a new version was deployed) */
  navigator.serviceWorker.addEventListener("message",function(e){ if(e.data&&e.data.type==="odin:updated") kUpdated(); });
  navigator.serviceWorker.addEventListener("controllerchange",function(){ if(kHadSW) kUpdated(); kHadSW=true; });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"){ kFront=performance.now(); kCheck(); }
    else if(kPending&&kSafe()) kReload();                                    /* going to the background with a new version waiting: swap it in unseen */
  });
}</script>
</body>
